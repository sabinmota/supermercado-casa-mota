<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Bolsa de compras con un corazón, frutas y una botella">
  <defs>
    <pattern id="puntos" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity=".35"/>
    </pattern>
    <pattern id="rayas" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="1.2" opacity=".25"/>
    </pattern>
  </defs>

  <!-- Mancha de fondo -->
  <path d="M52 150c-22-10-30-40-16-62 12-19 30-18 44-34 16-18 40-30 66-20 26 10 34 36 50 52 16 16 22 40 6 58-16 18-44 16-70 18-28 2-58-2-80-12z" fill="#e8f5ee"/>
  <circle cx="60" cy="70" r="16" fill="#f5b27a" opacity=".75"/>

  <!-- Bolsa de compras (verde Casa Mota) -->
  <rect x="68" y="58" width="72" height="104" rx="6" fill="#1a7c3e"/>
  <rect x="68" y="58" width="72" height="104" rx="6" fill="url(#puntos)"/>
  <path d="M86 66v-12a18 18 0 0 1 36 0v12" fill="none" stroke="#145e2e" stroke-width="5" stroke-linecap="round"/>
  <!-- Corazón -->
  <path d="M104 132c-2 0-24-14-24-30 0-9 7-15 14-15 5 0 8 3 10 6 2-3 5-6 10-6 7 0 14 6 14 15 0 16-22 30-24 30z" fill="#e53935"/>
  <path d="M104 132c-2 0-24-14-24-30 0-9 7-15 14-15 5 0 8 3 10 6 2-3 5-6 10-6 7 0 14 6 14 15 0 16-22 30-24 30z" fill="url(#rayas)"/>
  <path d="M90 97c1-4 4-6 7-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <!-- Botella de leche / jugo -->
  <path d="M150 84h18v10c8 6 12 14 12 24v38a6 6 0 0 1-6 6h-30a6 6 0 0 1-6-6v-38c0-10 4-18 12-24z" fill="#fffaf2" stroke="#c9bfae" stroke-width="2"/>
  <rect x="148" y="74" width="22" height="12" rx="3" fill="#27a35a"/>
  <path d="M138 122h42v20h-42z" fill="#27a35a"/>
  <path d="M146 132c6-8 14-8 26 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  <path d="M142 104c0-6 3-10 8-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <!-- Manzana -->
  <circle cx="176" cy="152" r="18" fill="#e53935"/>
  <circle cx="176" cy="152" r="18" fill="url(#puntos)" opacity=".6"/>
  <path d="M168 144a8 8 0 0 1 6-4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M176 134c0-5 2-8 4-10" fill="none" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180 128c6-8 16-8 20-4-4 8-14 10-20 4z" fill="#dff0e3" stroke="#27a35a" stroke-width="1.5"/>

  <!-- Limón -->
  <ellipse cx="60" cy="158" rx="16" ry="12" fill="#f9a825"/>
  <ellipse cx="60" cy="158" rx="16" ry="12" fill="url(#puntos)" opacity=".6"/>
  <path d="M52 152a8 5 0 0 1 8-3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <!-- Destellos -->
  <path d="M196 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f9a825"/>
  <path d="M42 108l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#27a35a"/>
  <circle cx="190" cy="100" r="3" fill="#e53935" opacity=".6"/>
</svg>
